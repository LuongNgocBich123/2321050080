let N1 = prompt("Mời bạn nhập số:"); // abc

        function check(N1) {
            if (N1 % 2 == 0) {
                document.write(N1 + " là số chẵn");
            } else {
                document.write(N1 + " là số lẻ");
            }
        }

        //N1 (abc) is not a number (true)
        if (!isNaN(N1)) {
            N1 = parseFloat(N1);
            check(N1);
        }
        else {
            document.writeln("Vui lòng nhập vào số!");
